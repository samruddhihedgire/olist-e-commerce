version: 2

models:

  - name: int_product_sales
    description: "Aggregated product-level sales information derived from order items."
    columns:
      - name: product_id
        description: "Unique identifier of the product."

      - name: total_items_sold
        description: "Total number of items sold for the product."

      - name: total_revenue
        description: "Total product revenue before considering freight."

      - name: total_freight
        description: "Total freight revenue associated with the product."

      - name: average_price
        description: "Average selling price of the product."


  - name: int_seller_sales
    description: "Aggregated seller-level sales and order performance."
    columns:
      - name: seller_id
        description: "Unique identifier of the seller."

      - name: total_items_sold
        description: "Total number of items sold by the seller."

      - name: total_revenue
        description: "Total product revenue generated by the seller."

      - name: total_freight
        description: "Total freight value generated by the seller."

      - name: average_item_price
        description: "Average selling price of items sold by the seller."


  - name: int_customer_orders
    description: "Customer-level aggregation containing order counts and customer spending."
    columns:
      - name: customer_unique_id
        description: "Unique identifier of the customer."

      - name: total_orders
        description: "Total number of orders placed by the customer."

      - name: total_spent
        description: "Total amount spent by the customer."

      - name: average_order_value
        description: "Average order value for the customer."


  - name: int_delivery_metrics
    description: "Order-level delivery performance metrics calculated from order timestamps."
    columns:
      - name: order_id
        description: "Unique identifier of the order."

      - name: delivery_days
        description: "Number of days between purchase and customer delivery."

      - name: estimated_delivery_days
        description: "Number of days between purchase and estimated delivery."

      - name: delivery_delay_days
        description: "Difference between actual delivery time and estimated delivery time."

      - name: delivery_status
        description: "Classification indicating whether an order was delivered early, on time, or late."


  - name: int_order_items_enriched
    description: "Order item dataset enriched with product, seller, category, customer, and order information."
    columns:
      - name: order_id
        description: "Unique identifier of the order."

      - name: order_item_id
        description: "Sequential item number within the order."

      - name: product_id
        description: "Unique identifier of the product."

      - name: seller_id
        description: "Unique identifier of the seller."

      - name: customer_id
        description: "Identifier of the customer."

      - name: product_category_name
        description: "Product category."

      - name: product_category_name_english
        description: "Product category translated into English."

      - name: price
        description: "Price of the product item."

      - name: freight_value
        description: "Freight charge associated with the item."